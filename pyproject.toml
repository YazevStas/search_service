[project]
name = "search-service"
version = "0.1.0"
description = "Document search service (FastAPI + PostgreSQL + Elasticsearch)"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi==0.141.1",
    "uvicorn[standard]==0.52.4",
    "sqlalchemy[asyncio]==2.0.54",
    "asyncpg==0.31.0",
    "elasticsearch[async]==8.15.1",
    "pydantic-settings==2.15.0",
]

[dependency-groups]
dev = [
    "pytest==8.3.4",
    "pytest-asyncio==0.24.0",
    "httpx==0.28.1",
]

[tool.uv]
package = false
# fastapi требует лишь starlette>=0.46; фиксируем уже устоявшийся релиз
constraint-dependencies = ["starlette==1.6.0"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

# Версии линтеров и форматеров зафиксированы в .pre-commit-config.yaml
[tool.black]
line-length = 88
target-version = ["py312"]

[tool.isort]
profile = "black"
line_length = 88
known_first_party = ["app", "scripts", "tests"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
# Форматирование делает black, импорты сортирует isort,
# поэтому ruff используется только как линтер.
select = [
    "E",    # ошибки pycodestyle
    "W",    # предупреждения pycodestyle
    "F",    # pyflakes
    "B",    # flake8-bugbear
    "UP",   # pyupgrade
    "SIM",  # flake8-simplify
]
ignore = [
    "E501", # длину строк контролирует black
    "B008", # вызовы в аргументах по умолчанию — штатный паттерн FastAPI (Depends/Query)
]
